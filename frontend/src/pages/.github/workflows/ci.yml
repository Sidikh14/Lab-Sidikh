name: CI

# Déclenché à chaque push et sur chaque pull request visant `main`.
# Vercel (frontend) et Render (backend) redéploient déjà automatiquement à
# chaque push — ce pipeline ne déploie rien, il sert de garde-fou : il
# vérifie que le code ne casse pas AVANT que Vercel/Render ne le découvrent
# en production. Chaque job ne se déclenche que si son dossier a changé.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      # Reproduit exactement ce que fait Vercel au déploiement (vite build).
      # Un fichier qui ne compile pas (import cassé, JSX invalide…) fait
      # échouer le job ici, sur la pull request, au lieu d'être découvert
      # après le déploiement.
      - name: Build (vite build)
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend — vérification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        working-directory: backend
        run: npm ci

      # Aucun script "test" n'existe encore dans backend/package.json : en
      # attendant, on vérifie au minimum que chaque fichier .js est
      # syntaxiquement valide (node --check) — ça aurait attrapé, par
      # exemple, un fichier renommé par erreur ou une accolade oubliée.
      # Dès qu'un vrai script "test" existe, remplacez ce step par :
      #   run: npm test
      - name: Vérification de syntaxe (node --check)
        working-directory: backend
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      # Si un script "test" est ajouté plus tard à backend/package.json,
      # décommentez ce step (et retirez celui ci-dessus si vous préférez
      # remplacer plutôt que cumuler) :
      # - name: Tests
      #   working-directory: backend
      #   run: npm test

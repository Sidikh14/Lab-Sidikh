databases:
  - name: commercants-db
    databaseName: commercants
    plan: free

services:
  - type: web
    name: commercants-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ADMIN_REGISTRATION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: commercants-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://commercants-frontend.onrender.com

  - type: web
    name: commercants-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://commercants-api.onrender.com
